name: Verify PM deployment controls
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: pm-deployment-control-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  deployment-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test actual performer and remote guards with offline command doubles
        run: python3 -B .github/hp-deploy/test-deployment-controls.py
      - name: Test staging lease parser
        run: python3 -B .github/hp-deploy/staging-lease-check-test.py
      - name: Test state-bound forward and recovery qualifier without target calls
        run: python3 -B .github/hp-deploy/test-state-bound.py
      - name: Test actual adapter process and private raw-capture faults
        run: python3 -B .github/hp-deploy/test-pm-actual-adapter.py
      - name: Test actual full-metadata transition and immutable repeat
        run: python3 -B .github/hp-deploy/test-pm-actual-transition.py
      - name: Test copy guardian actual FD and process lifetime
        run: python3 -B .github/hp-deploy/test-pm-copy-guardian.py
      - name: Test Linux authenticated broker and guardian loss with a temporary fake server
        run: python3 -B .github/hp-deploy/test-pm-broker-copy.py
      - name: Test actual finite native reader with disconnected boundaries
        run: php -n .github/hp-deploy/test-pm-native-reader.php
      - name: Test actual private pre-init getter and durable record methods
        run: php -n .github/hp-deploy/test-pm-preinit-guard.php
      - name: Verify workflow coupling
        run: php tests/deploy-workflow-contract-test.php
      - name: Record actual packaging comparison without imposing an old runtime on future features
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B .github/hp-deploy/package-equivalence.py --baseline "$BASE_SHA" --candidate "$HEAD_SHA" --output "$RUNNER_TEMP/pm-packaging-comparison.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm-controls-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pm-packaging-comparison.json
          if-no-files-found: error
